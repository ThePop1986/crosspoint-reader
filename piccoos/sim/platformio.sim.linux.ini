; PiccoOS simulator config (linux). Generated from crosspoint-simulator 84c3421
; (sample-platformio-linux-wsl.ini), reduced to [env:simulator] + [env:simulator_picco], simulator pinned by SHA.
; Usage: cp piccoos/sim/platformio.sim.linux.ini platformio.local.ini
; (platformio.ini already has `extra_configs = platformio.local.ini`; *.local* is git-ignored.)

[env:simulator]
platform = native
lib_ldf_mode = deep+
lib_compat_mode = off
; Optional native JPEG/PNG decoder mode:
; - add -DCROSSPOINT_SIM_USE_NATIVE_DECODERS under build_flags
; - change lib_ignore to: hal, WebSockets, SecureNet
; - uncomment the PNGdec/JPEGDEC entries under lib_deps
; Uncomment when you also add the optional project-side hook below.
; custom_run_simulator_target_owner = project
; Uncomment if host ports 8080/8081 are occupied. WebSocket uses the next port.
; custom_simulator_http_port = 18080
build_src_filter =
  +<*>
  ; Firmware-update code remains non-destructive in the simulator.
  -<network/FirmwareFlasher.cpp>
  -<network/OtaBootSwitch.cpp>
  -<network/OtaUpdater.cpp>
  -<platform/skip_efuse_blk_check.c>
  -<platform/S31NimbleMemory.cpp>
build_flags =
  -std=gnu++2a
  !sdl2-config --cflags --libs
  -lssl
  -lcrypto
  -Wno-deprecated-declarations
  -Wno-narrowing
  -DSIMULATOR
  -DFREEINK_DEVICE_X4=1
  -DCROSSPOINT_SIMULATOR_PROJECT_WEBSERVER
  -DCROSSPOINT_VERSION=\"dev-simulator\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  -DMINIZ_NO_ZLIB_COMPATIBLE_NAMES=1
  -DXML_GE=0
  -DXML_CONTEXT_BYTES=1024
  -DUSE_UTF8_LONG_NAMES=1
  -DPNG_MAX_BUFFERED_PIXELS=16416
  -DDISABLE_FS_H_WARNING=1
  -DDESTRUCTOR_CLOSES_FILE=1
  -Isrc
  -Ifreeink-sdk/libs/network/BleKeyboardHost/include
  ; -DCROSSPOINT_SIM_USE_NATIVE_DECODERS
  ; -Dmemcpy_P=memcpy ; For native JPEGDEC
; The simulator supplies host network shims instead of embedded SecureNet.
lib_ignore = hal, PNGdec, JPEGDEC, WebSockets, SecureNet
extra_scripts =
  pre:.pio/libdeps/$PIOENV/simulator/skip_device_content_protection.py
  pre:scripts/gen_i18n.py
  pre:scripts/git_branch.py
  pre:scripts/build_html.py
  ; Optional IDE task exposure:
  ; post:.pio/libdeps/$PIOENV/simulator/run_simulator_project.py
lib_deps =
  simulator=https://github.com/crosspoint-reader/crosspoint-simulator.git#84c3421da6f707d6ebe919b3fafca7387ff06464
  JsonSax=symlink://freeink-sdk/libs/network/JsonSax
  Opds=symlink://freeink-sdk/libs/network/Opds
  SecureNet=symlink://freeink-sdk/libs/network/SecureNet
  CatalogList=symlink://freeink-sdk/libs/network/CatalogList
  FreeInkUI=symlink://freeink-sdk/libs/ui/FreeInkUI
  Icons=symlink://freeink-sdk/libs/assets/Icons
  FreeInkFont=symlink://freeink-sdk/libs/font/FreeInkFont
  bblanchon/ArduinoJson @ 7.4.2
  ricmoo/QRCode @ 0.0.1
  https://github.com/bitbank2/AnimatedGIF.git#d01888f0255fd0781fc2b8600b9111b14c999584
  ; Native decoder opt-in only:
  ; bitbank2/PNGdec @ 1.1.6
  ; https://github.com/bitbank2/JPEGDEC.git#86282979224c8a32fd51e091ed5a35b0c699a52b
  links2004/WebSockets @ 2.7.3

[env:simulator_picco]
extends = env:simulator
build_flags =
  ${env:simulator.build_flags}
  -DSIMULATOR_DEVICE_PICCO
  -UFREEINK_DEVICE_X4
  -DFREEINK_DEVICE_PICCO=1
  -DBOARD_HAS_PSRAM
